# EcoRAEE Cloud — todo el sistema en local con un comando:  docker compose up --build
# Web: http://localhost:8080 · API: http://localhost:8080/api/docs · MCP: http://localhost:8001/mcp
# Equivale a la arquitectura de AWS: nginx ≈ S3+CloudFront, api ≈ ECS/EC2 tras el ALB, db ≈ RDS PostgreSQL 16.
name: ecoraee

x-api-env: &api-env
  ENTORNO: desarrollo
  DB_HOST: db
  DB_NOMBRE: ecoraee
  DB_CLAVE_API: ${API_DB_PASS:-api_local_cambiar}
  DB_CLAVE_MCP: ${MCP_DB_PASS:-mcp_local_cambiar}
  JWT_SECRETO: ${JWT_SECRETO:-local-solo-desarrollo-cambiar}
  CORREO_MODO: smtp
  CORREO_REMITENTE: no-reply@ecoraee.invalid
  CORREO_SMTP_HOST: mailpit
  CORREO_SMTP_PUERTO: 1025
  AUTH_MODO: local
  DEMO: ${DEMO:-true}
  ALMACEN_MODO: local
  ALMACEN_DIR: /app/almacen
  CORS_ORIGENES: http://localhost:8080,http://localhost:5171
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

services:
  mailpit:
    image: axllent/mailpit:v1.27.9
    ports: ["127.0.0.1:8025:8025"]
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ecoraee
      POSTGRES_USER: ecoraee_admin
      POSTGRES_PASSWORD: ${DB_ADMIN_PASS:-admin_local_cambiar}
      API_DB_PASS: ${API_DB_PASS:-api_local_cambiar}
      MCP_DB_PASS: ${MCP_DB_PASS:-mcp_local_cambiar}
      DEMO: ${DEMO:-true}
    volumes:
      - ./database:/database:ro
      - ./database/docker-init.sh:/docker-entrypoint-initdb.d/00_ecoraee.sh:ro
      - datos:/var/lib/postgresql/data
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecoraee_admin -d ecoraee && psql -U ecoraee_admin -d ecoraee -tAc \"select 1 from pg_roles where rolname='ecoraee_api_svc'\" | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 40

  api:
    image: ecoraee-api
    build: { context: ., dockerfile: backend/Dockerfile }
    environment: *api-env
    command: sh -c "python -m app.cli inicializar && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips '*'"
    volumes: [almacen:/app/almacen]
    depends_on: { db: { condition: service_healthy } }

  mcp:
    image: ecoraee-api            # misma imagen que la API (se reutiliza la caché), otro comando
    build: { context: ., dockerfile: backend/Dockerfile }
    environment: *api-env
    command: uvicorn mcp_server.server:app --host 0.0.0.0 --port 8001
    ports: ["8001:8001"]
    healthcheck:                  # el de la imagen mira la API (8000); el MCP escucha en 8001
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8001), 2)"]
      interval: 30s
      timeout: 3s
      start_period: 10s
    depends_on: { api: { condition: service_healthy } }

  web:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: { api: { condition: service_healthy } }

volumes:
  datos:
  almacen:
