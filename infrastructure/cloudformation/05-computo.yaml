{
  "AWSTemplateFormatVersion": "2010-09-09",
  "Description": "EcoRAEE - 05-computo",
  "Parameters": {
    "Prefijo": {
      "Type": "String",
      "Default": "ecoraee-lab"
    },
    "Entorno": {
      "Type": "String",
      "Default": "lab"
    },
    "Responsable": {
      "Type": "String"
    },
    "BucketArtefactos": {
      "Type": "String"
    },
    "ClaveArtefacto": {
      "Type": "String"
    },
    "SecretoServiciosArn": {
      "Type": "String"
    },
    "SecretoJwtArn": {
      "Type": "String"
    },
    "BucketEvidencias": {
      "Type": "String"
    },
    "BucketContenidos": {
      "Type": "String"
    },
    "OrigenWeb": {
      "Type": "String"
    },
    "GrupoLogs": {
      "Type": "String"
    },
    "AmiId": {
      "Type": "AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>",
      "Default": "/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64"
    },
    "TipoInstancia": {
      "Type": "String",
      "Default": "t3.small",
      "AllowedValues": [
        "t3.micro",
        "t3.small"
      ]
    },
    "AuthModo": {
      "Type": "String",
      "Default": "local",
      "AllowedValues": [
        "local"
      ]
    },
    "OriginVerifySecret": {
      "Type": "String",
      "NoEcho": true,
      "MinLength": 16,
      "MaxLength": 128,
      "AllowedPattern": "[a-zA-Z0-9]+"
    },
    "CorreoModo": {
      "Type": "String",
      "Default": "ses",
      "AllowedValues": [
        "consola",
        "smtp",
        "ses"
      ]
    },
    "CorreoRemitente": {
      "Type": "String",
      "Default": "no-reply@ecoraee.invalid",
      "AllowedPattern": "[a-zA-Z0-9._%+@-]+"
    }
  },
  "Resources": {
    "OriginSecret": {
      "Type": "AWS::SecretsManager::Secret",
      "Properties": {
        "Name": {
          "Fn::Sub": "${Prefijo}/origin"
        },
        "SecretString": {
          "Ref": "OriginVerifySecret"
        },
        "Tags": [
          {
            "Key": "Proyecto",
            "Value": "EcoRAEE"
          },
          {
            "Key": "Entorno",
            "Value": {
              "Ref": "Entorno"
            }
          },
          {
            "Key": "Responsable",
            "Value": {
              "Ref": "Responsable"
            }
          }
        ]
      }
    },
    "Logs": {
      "Type": "AWS::Logs::LogGroup",
      "Properties": {
        "LogGroupName": {
          "Ref": "GrupoLogs"
        },
        "RetentionInDays": 30,
        "Tags": [
          {
            "Key": "Proyecto",
            "Value": "EcoRAEE"
          },
          {
            "Key": "Entorno",
            "Value": {
              "Ref": "Entorno"
            }
          },
          {
            "Key": "Responsable",
            "Value": {
              "Ref": "Responsable"
            }
          }
        ]
      }
    },
    "Instance": {
      "Type": "AWS::EC2::Instance",
      "DependsOn": [
        "Logs"
      ],
      "Properties": {
        "ImageId": {
          "Ref": "AmiId"
        },
        "InstanceType": {
          "Ref": "TipoInstancia"
        },
        "IamInstanceProfile": {
          "Fn::ImportValue": {
            "Fn::Sub": "${Prefijo}-InstanceProfile"
          }
        },
        "NetworkInterfaces": [
          {
            "DeviceIndex": "0",
            "SubnetId": {
              "Fn::ImportValue": {
                "Fn::Sub": "${Prefijo}-Publica1"
              }
            },
            "AssociatePublicIpAddress": true,
            "GroupSet": [
              {
                "Fn::ImportValue": {
                  "Fn::Sub": "${Prefijo}-AppSG"
                }
              }
            ]
          }
        ],
        "MetadataOptions": {
          "HttpTokens": "required",
          "HttpEndpoint": "enabled",
          "HttpPutResponseHopLimit": 2
        },
        "BlockDeviceMappings": [
          {
            "DeviceName": "/dev/xvda",
            "Ebs": {
              "Encrypted": true,
              "VolumeSize": 20,
              "VolumeType": "gp3",
              "DeleteOnTermination": true
            }
          }
        ],
        "UserData": {
          "Fn::Base64": {
            "Fn::Sub": [
              "#!/bin/bash\nset -euxo pipefail\ndnf install -y docker amazon-cloudwatch-agent awscli-2 unzip\nsystemctl enable --now docker\nmkdir -p /opt/ecoraee\naws s3 cp s3://${BucketArtefactos}/${ClaveArtefacto} /tmp/ecoraee.zip --region ${AWS::Region}\nunzip -q /tmp/ecoraee.zip -d /opt/ecoraee\ncd /opt/ecoraee\ncurl --fail --silent --show-error https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem -o /opt/ecoraee/rds-ca.pem\ndocker build -f backend/Dockerfile -t ecoraee-api .\ncat > /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json <<'EOF'\n{\"agent\":{\"metrics_collection_interval\":60},\"metrics\":{\"namespace\":\"EcoRAEE\",\"append_dimensions\":{\"InstanceId\":\"${!aws:InstanceId}\"},\"metrics_collected\":{\"mem\":{\"measurement\":[\"mem_used_percent\"]},\"disk\":{\"measurement\":[\"used_percent\"],\"resources\":[\"/\"]}}}}\nEOF\n/opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl -a fetch-config -m ec2 -s -c file:/opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json\nIMDS_TOKEN=$(curl --fail --silent --show-error -X PUT -H \"X-aws-ec2-metadata-token-ttl-seconds: 21600\" http://169.254.169.254/latest/api/token)\nINSTANCE_ID=$(curl --fail --silent --show-error -H \"X-aws-ec2-metadata-token: $IMDS_TOKEN\" http://169.254.169.254/latest/meta-data/instance-id)\ndocker run -d --restart unless-stopped --name ecoraee-api -p 80:8000 --log-driver awslogs --log-opt awslogs-region=${AWS::Region} --log-opt awslogs-group=${GrupoLogs} --log-opt awslogs-stream=api-$INSTANCE_ID -v /opt/ecoraee/rds-ca.pem:/etc/ssl/rds-ca.pem:ro -e SSL_CERT_FILE=/etc/ssl/rds-ca.pem -e ENTORNO=produccion -e DEMO=false -e DB_SSL=true -e CORREO_MODO=${CorreoModo} -e CORREO_REMITENTE=${CorreoRemitente} -e AUTH_MODO=${AuthModo} -e DB_SECRET_ARN=${SecretoServiciosArn} -e JWT_SECRET_ARN=${SecretoJwtArn} -e ORIGIN_SECRET_ARN=${OriginSecret} -e SNS_TOPIC_ARN=${TemaEventosArn} -e AWS_REGION=${AWS::Region} -e ALMACEN_MODO=s3 -e BUCKET_EVIDENCIAS=${BucketEvidencias} -e BUCKET_CONTENIDOS=${BucketContenidos} -e CORS_ORIGENES=${OrigenWeb} ecoraee-api uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*' --no-access-log\n",
              {
                "TemaEventosArn": {
                  "Fn::ImportValue": {
                    "Fn::Sub": "${Prefijo}-TemaEventosArn"
                  }
                }
              }
            ]
          }
        },
        "Tags": [
          {
            "Key": "Proyecto",
            "Value": "EcoRAEE"
          },
          {
            "Key": "Entorno",
            "Value": {
              "Ref": "Entorno"
            }
          },
          {
            "Key": "Responsable",
            "Value": {
              "Ref": "Responsable"
            }
          }
        ],
        "Monitoring": false
      }
    },
    "RecoveryAlarm": {
      "Type": "AWS::CloudWatch::Alarm",
      "Properties": {
        "Namespace": "AWS/EC2",
        "MetricName": "StatusCheckFailed_System",
        "Dimensions": [
          {
            "Name": "InstanceId",
            "Value": {
              "Ref": "Instance"
            }
          }
        ],
        "Statistic": "Minimum",
        "Period": 60,
        "EvaluationPeriods": 2,
        "Threshold": 1,
        "ComparisonOperator": "GreaterThanOrEqualToThreshold",
        "TreatMissingData": "missing",
        "AlarmActions": [
          {
            "Fn::Sub": "arn:${AWS::Partition}:automate:${AWS::Region}:ec2:recover"
          }
        ]
      }
    }
  },
  "Outputs": {
    "InstanceId": {
      "Value": {
        "Ref": "Instance"
      },
      "Export": {
        "Name": {
          "Fn::Sub": "${Prefijo}-InstanceId"
        }
      }
    },
    "PublicDnsName": {
      "Value": {
        "Fn::GetAtt": [
          "Instance",
          "PublicDnsName"
        ]
      },
      "Export": {
        "Name": {
          "Fn::Sub": "${Prefijo}-PublicDnsName"
        }
      }
    },
    "GrupoLogs": {
      "Value": {
        "Ref": "Logs"
      },
      "Export": {
        "Name": {
          "Fn::Sub": "${Prefijo}-GrupoLogs"
        }
      }
    }
  }
}
