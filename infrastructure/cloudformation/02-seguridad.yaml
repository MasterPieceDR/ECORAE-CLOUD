{
  "AWSTemplateFormatVersion": "2010-09-09",
  "Description": "EcoRAEE - 02-seguridad",
  "Parameters": {
    "Prefijo": {
      "Type": "String",
      "Default": "ecoraee-lab"
    },
    "Entorno": {
      "Type": "String",
      "Default": "lab"
    },
    "Responsable": {
      "Type": "String"
    },
    "UsarLabRole": {
      "Type": "String",
      "Default": "false",
      "AllowedValues": [
        "true",
        "false"
      ]
    },
    "LabInstanceProfile": {
      "Type": "String",
      "Default": "LabInstanceProfile"
    },
    "BucketEvidencias": {
      "Type": "String"
    },
    "BucketContenidos": {
      "Type": "String"
    },
    "BucketArtefactos": {
      "Type": "String"
    },
    "ClaveArtefacto": {
      "Type": "String"
    },
    "SecretoServiciosArn": {
      "Type": "String"
    },
    "SecretoJwtArn": {
      "Type": "String"
    },
    "CloudFrontPrefixListId": {
      "Type": "String",
      "Description": "ID regional: aws ec2 describe-managed-prefix-lists --filters Name=prefix-list-name,Values=com.amazonaws.global.cloudfront.origin-facing"
    },
    "CorreoRemitente": {
      "Type": "String",
      "Default": "no-reply@ecoraee.invalid",
      "AllowedPattern": "[a-zA-Z0-9._%+@-]+"
    },
    "CorreoEventos": {
      "Type": "String",
      "Description": "Correo para suscripcion a eventos de negocio"
    }
  },
  "Resources": {
    "ALBSG": {
      "Type": "AWS::EC2::SecurityGroup",
      "Properties": {
        "VpcId": {
          "Fn::ImportValue": {
            "Fn::Sub": "${Prefijo}-VPC"
          }
        },
        "GroupDescription": "ALB publico",
        "Tags": [
          {
            "Key": "Proyecto",
            "Value": "EcoRAEE"
          },
          {
            "Key": "Entorno",
            "Value": {
              "Ref": "Entorno"
            }
          },
          {
            "Key": "Responsable",
            "Value": {
              "Ref": "Responsable"
            }
          }
        ]
      }
    },
    "AppSG": {
      "Type": "AWS::EC2::SecurityGroup",
      "Properties": {
        "VpcId": {
          "Fn::ImportValue": {
            "Fn::Sub": "${Prefijo}-VPC"
          }
        },
        "GroupDescription": "API privada",
        "Tags": [
          {
            "Key": "Proyecto",
            "Value": "EcoRAEE"
          },
          {
            "Key": "Entorno",
            "Value": {
              "Ref": "Entorno"
            }
          },
          {
            "Key": "Responsable",
            "Value": {
              "Ref": "Responsable"
            }
          }
        ]
      }
    },
    "DBSG": {
      "Type": "AWS::EC2::SecurityGroup",
      "Properties": {
        "VpcId": {
          "Fn::ImportValue": {
            "Fn::Sub": "${Prefijo}-VPC"
          }
        },
        "GroupDescription": "RDS privado",
        "Tags": [
          {
            "Key": "Proyecto",
            "Value": "EcoRAEE"
          },
          {
            "Key": "Entorno",
            "Value": {
              "Ref": "Entorno"
            }
          },
          {
            "Key": "Responsable",
            "Value": {
              "Ref": "Responsable"
            }
          }
        ]
      }
    },
    "ALBIngress": {
      "Type": "AWS::EC2::SecurityGroupIngress",
      "Properties": {
        "GroupId": {
          "Ref": "ALBSG"
        },
        "IpProtocol": "tcp",
        "FromPort": 80,
        "ToPort": 80,
        "SourcePrefixListId": {
          "Ref": "CloudFrontPrefixListId"
        }
      }
    },
    "AppIngress": {
      "Type": "AWS::EC2::SecurityGroupIngress",
      "Properties": {
        "GroupId": {
          "Ref": "AppSG"
        },
        "IpProtocol": "tcp",
        "FromPort": 8000,
        "ToPort": 8000,
        "SourceSecurityGroupId": {
          "Ref": "ALBSG"
        }
      }
    },
    "DBIngress": {
      "Type": "AWS::EC2::SecurityGroupIngress",
      "Properties": {
        "GroupId": {
          "Ref": "DBSG"
        },
        "IpProtocol": "tcp",
        "FromPort": 5432,
        "ToPort": 5432,
        "SourceSecurityGroupId": {
          "Ref": "AppSG"
        }
      }
    },
    "RuntimeRole": {
      "Type": "AWS::IAM::Role",
      "Condition": "CrearRol",
      "Properties": {
        "AssumeRolePolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "Service": "ec2.amazonaws.com"
              },
              "Action": "sts:AssumeRole"
            }
          ]
        },
        "ManagedPolicyArns": [
          {
            "Fn::Sub": "arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore"
          },
          {
            "Fn::Sub": "arn:${AWS::Partition}:iam::aws:policy/CloudWatchAgentServerPolicy"
          }
        ],
        "Policies": [
          {
            "PolicyName": "RuntimeDataPolicy",
            "PolicyDocument": {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Action": [
                    "s3:GetObject",
                    "s3:PutObject",
                    "s3:DeleteObject"
                  ],
                  "Resource": [
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:s3:::${BucketEvidencias}/*"
                    },
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:s3:::${BucketContenidos}/*"
                    }
                  ]
                },
                {
                  "Effect": "Allow",
                  "Action": [
                    "s3:GetObject"
                  ],
                  "Resource": [
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:s3:::${BucketArtefactos}/${ClaveArtefacto}"
                    }
                  ]
                },
                {
                  "Effect": "Allow",
                  "Action": "secretsmanager:GetSecretValue",
                  "Resource": [
                    {
                      "Ref": "SecretoServiciosArn"
                    },
                    {
                      "Ref": "SecretoJwtArn"
                    }
                  ]
                },
                {
                  "Effect": "Allow",
                  "Action": "ses:SendEmail",
                  "Resource": {
                    "Fn::Sub": "arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/${CorreoRemitente}"
                  }
                },
                {
                  "Effect": "Allow",
                  "Action": "sns:Publish",
                  "Resource": {
                    "Ref": "TemaEventos"
                  }
                }
              ]
            }
          }
        ],
        "Tags": [
          {
            "Key": "Proyecto",
            "Value": "EcoRAEE"
          },
          {
            "Key": "Entorno",
            "Value": {
              "Ref": "Entorno"
            }
          },
          {
            "Key": "Responsable",
            "Value": {
              "Ref": "Responsable"
            }
          }
        ]
      }
    },
    "Profile": {
      "Type": "AWS::IAM::InstanceProfile",
      "Condition": "CrearRol",
      "Properties": {
        "Roles": [
          {
            "Ref": "RuntimeRole"
          }
        ]
      }
    },
    "TemaEventos": {
      "Type": "AWS::SNS::Topic",
      "Properties": {
        "TopicName": {
          "Fn::Sub": "${Prefijo}-eventos"
        },
        "KmsMasterKeyId": "alias/aws/sns",
        "Subscription": [
          {
            "Endpoint": {
              "Ref": "CorreoEventos"
            },
            "Protocol": "email"
          }
        ]
      }
    }
  },
  "Outputs": {
    "ALBSG": {
      "Value": {
        "Ref": "ALBSG"
      },
      "Export": {
        "Name": {
          "Fn::Sub": "${Prefijo}-ALBSG"
        }
      }
    },
    "AppSG": {
      "Value": {
        "Ref": "AppSG"
      },
      "Export": {
        "Name": {
          "Fn::Sub": "${Prefijo}-AppSG"
        }
      }
    },
    "DBSG": {
      "Value": {
        "Ref": "DBSG"
      },
      "Export": {
        "Name": {
          "Fn::Sub": "${Prefijo}-DBSG"
        }
      }
    },
    "InstanceProfile": {
      "Value": {
        "Fn::If": [
          "CrearRol",
          {
            "Ref": "Profile"
          },
          {
            "Ref": "LabInstanceProfile"
          }
        ]
      },
      "Export": {
        "Name": {
          "Fn::Sub": "${Prefijo}-InstanceProfile"
        }
      }
    },
    "TemaEventosArn": {
      "Value": {
        "Ref": "TemaEventos"
      },
      "Export": {
        "Name": {
          "Fn::Sub": "${Prefijo}-TemaEventosArn"
        }
      }
    }
  },
  "Conditions": {
    "CrearRol": {
      "Fn::Equals": [
        {
          "Ref": "UsarLabRole"
        },
        "false"
      ]
    }
  }
}
