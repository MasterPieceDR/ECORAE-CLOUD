{
  "AWSTemplateFormatVersion": "2010-09-09",
  "Description": "EcoRAEE - 07-observabilidad",
  "Parameters": {
    "Prefijo": {
      "Type": "String",
      "Default": "ecoraee-lab"
    },
    "Entorno": {
      "Type": "String",
      "Default": "lab"
    },
    "Responsable": {
      "Type": "String"
    },
    "BucketAuditoria": {
      "Type": "String"
    },
    "CorreoAlerta": {
      "Type": "String"
    },
    "PresupuestoUSD": {
      "Type": "Number",
      "Default": 100
    }
  },
  "Resources": {
    "SuscripcionAlertas": {
      "Type": "AWS::SNS::Subscription",
      "Properties": {
        "TopicArn": {
          "Ref": "Topic"
        },
        "Protocol": "email",
        "Endpoint": {
          "Ref": "CorreoAlerta"
        }
      }
    },
    "Topic": {
      "Type": "AWS::SNS::Topic",
      "Properties": {
        "Tags": [
          {
            "Key": "Proyecto",
            "Value": "EcoRAEE"
          },
          {
            "Key": "Entorno",
            "Value": {
              "Ref": "Entorno"
            }
          },
          {
            "Key": "Responsable",
            "Value": {
              "Ref": "Responsable"
            }
          }
        ]
      }
    },
    "TrailBucket": {
      "Type": "AWS::S3::Bucket",
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain",
      "Properties": {
        "BucketName": {
          "Ref": "BucketAuditoria"
        },
        "PublicAccessBlockConfiguration": {
          "BlockPublicAcls": true,
          "BlockPublicPolicy": true,
          "IgnorePublicAcls": true,
          "RestrictPublicBuckets": true
        },
        "BucketEncryption": {
          "ServerSideEncryptionConfiguration": [
            {
              "ServerSideEncryptionByDefault": {
                "SSEAlgorithm": "AES256"
              }
            }
          ]
        },
        "VersioningConfiguration": {
          "Status": "Enabled"
        },
        "LifecycleConfiguration": {
          "Rules": [
            {
              "Id": "VersionesAntiguas",
              "Status": "Enabled",
              "NoncurrentVersionExpiration": {
                "NoncurrentDays": 90
              },
              "AbortIncompleteMultipartUpload": {
                "DaysAfterInitiation": 7
              }
            }
          ]
        },
        "Tags": [
          {
            "Key": "Proyecto",
            "Value": "EcoRAEE"
          },
          {
            "Key": "Entorno",
            "Value": {
              "Ref": "Entorno"
            }
          },
          {
            "Key": "Responsable",
            "Value": {
              "Ref": "Responsable"
            }
          }
        ]
      }
    },
    "TrailPolicy": {
      "Type": "AWS::S3::BucketPolicy",
      "Properties": {
        "Bucket": {
          "Ref": "TrailBucket"
        },
        "PolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "ACL",
              "Effect": "Allow",
              "Principal": {
                "Service": "cloudtrail.amazonaws.com"
              },
              "Action": "s3:GetBucketAcl",
              "Resource": {
                "Fn::GetAtt": [
                  "TrailBucket",
                  "Arn"
                ]
              }
            },
            {
              "Sid": "Write",
              "Effect": "Allow",
              "Principal": {
                "Service": "cloudtrail.amazonaws.com"
              },
              "Action": "s3:PutObject",
              "Resource": {
                "Fn::Sub": "arn:${AWS::Partition}:s3:::${BucketAuditoria}/AWSLogs/${AWS::AccountId}/*"
              },
              "Condition": {
                "StringEquals": {
                  "s3:x-amz-acl": "bucket-owner-full-control"
                }
              }
            }
          ]
        }
      }
    },
    "Trail": {
      "Type": "AWS::CloudTrail::Trail",
      "DependsOn": "TrailPolicy",
      "Properties": {
        "S3BucketName": {
          "Ref": "TrailBucket"
        },
        "IsLogging": true,
        "IsMultiRegionTrail": true,
        "EnableLogFileValidation": true,
        "IncludeGlobalServiceEvents": true,
        "Tags": [
          {
            "Key": "Proyecto",
            "Value": "EcoRAEE"
          },
          {
            "Key": "Entorno",
            "Value": {
              "Ref": "Entorno"
            }
          },
          {
            "Key": "Responsable",
            "Value": {
              "Ref": "Responsable"
            }
          }
        ]
      }
    },
    "Budget": {
      "Type": "AWS::Budgets::Budget",
      "Properties": {
        "Budget": {
          "BudgetName": {
            "Fn::Sub": "${Prefijo}-mensual"
          },
          "BudgetLimit": {
            "Amount": {
              "Ref": "PresupuestoUSD"
            },
            "Unit": "USD"
          },
          "TimeUnit": "MONTHLY",
          "BudgetType": "COST"
        },
        "NotificationsWithSubscribers": [
          {
            "Notification": {
              "NotificationType": "ACTUAL",
              "ComparisonOperator": "GREATER_THAN",
              "Threshold": 80,
              "ThresholdType": "PERCENTAGE"
            },
            "Subscribers": [
              {
                "SubscriptionType": "EMAIL",
                "Address": {
                  "Ref": "CorreoAlerta"
                }
              }
            ]
          }
        ]
      }
    },
    "CPU": {
      "Type": "AWS::CloudWatch::Alarm",
      "Properties": {
        "Namespace": "AWS/EC2",
        "MetricName": "CPUUtilization",
        "Dimensions": [
          {
            "Name": "InstanceId",
            "Value": {
              "Fn::ImportValue": {
                "Fn::Sub": "${Prefijo}-InstanceId"
              }
            }
          }
        ],
        "Statistic": "Average",
        "Period": 300,
        "EvaluationPeriods": 1,
        "Threshold": 80,
        "ComparisonOperator": "GreaterThanThreshold",
        "TreatMissingData": "notBreaching",
        "AlarmActions": [
          {
            "Ref": "Topic"
          }
        ]
      }
    },
    "DBCPU": {
      "Type": "AWS::CloudWatch::Alarm",
      "Properties": {
        "Namespace": "AWS/RDS",
        "MetricName": "CPUUtilization",
        "Dimensions": [
          {
            "Name": "DBInstanceIdentifier",
            "Value": {
              "Fn::ImportValue": {
                "Fn::Sub": "${Prefijo}-DB"
              }
            }
          }
        ],
        "Statistic": "Average",
        "Period": 300,
        "EvaluationPeriods": 1,
        "Threshold": 80,
        "ComparisonOperator": "GreaterThanThreshold",
        "TreatMissingData": "notBreaching",
        "AlarmActions": [
          {
            "Ref": "Topic"
          }
        ]
      }
    },
    "DBSpace": {
      "Type": "AWS::CloudWatch::Alarm",
      "Properties": {
        "Namespace": "AWS/RDS",
        "MetricName": "FreeStorageSpace",
        "Dimensions": [
          {
            "Name": "DBInstanceIdentifier",
            "Value": {
              "Fn::ImportValue": {
                "Fn::Sub": "${Prefijo}-DB"
              }
            }
          }
        ],
        "Statistic": "Average",
        "Period": 300,
        "EvaluationPeriods": 1,
        "Threshold": 2147483648,
        "ComparisonOperator": "LessThanThreshold",
        "TreatMissingData": "notBreaching",
        "AlarmActions": [
          {
            "Ref": "Topic"
          }
        ]
      }
    },
    "DBConnections": {
      "Type": "AWS::CloudWatch::Alarm",
      "Properties": {
        "Namespace": "AWS/RDS",
        "MetricName": "DatabaseConnections",
        "Dimensions": [
          {
            "Name": "DBInstanceIdentifier",
            "Value": {
              "Fn::ImportValue": {
                "Fn::Sub": "${Prefijo}-DB"
              }
            }
          }
        ],
        "Statistic": "Average",
        "Period": 300,
        "EvaluationPeriods": 1,
        "Threshold": 70,
        "ComparisonOperator": "GreaterThanThreshold",
        "TreatMissingData": "notBreaching",
        "AlarmActions": [
          {
            "Ref": "Topic"
          }
        ]
      }
    },
    "EstadoEC2": {
      "Type": "AWS::CloudWatch::Alarm",
      "Properties": {
        "Namespace": "AWS/EC2",
        "MetricName": "StatusCheckFailed",
        "Dimensions": [
          {
            "Name": "InstanceId",
            "Value": {
              "Fn::ImportValue": {
                "Fn::Sub": "${Prefijo}-InstanceId"
              }
            }
          }
        ],
        "Statistic": "Maximum",
        "Period": 300,
        "EvaluationPeriods": 1,
        "Threshold": 1,
        "ComparisonOperator": "GreaterThanOrEqualToThreshold",
        "TreatMissingData": "notBreaching",
        "AlarmActions": [
          {
            "Ref": "Topic"
          }
        ]
      }
    },
    "ErroresFiltro": {
      "Type": "AWS::Logs::MetricFilter",
      "Properties": {
        "LogGroupName": {
          "Fn::ImportValue": {
            "Fn::Sub": "${Prefijo}-GrupoLogs"
          }
        },
        "FilterPattern": "{ $.estado >= 500 }",
        "MetricTransformations": [
          {
            "MetricNamespace": "EcoRAEE/API",
            "MetricName": "Errores5xx",
            "MetricValue": "1",
            "DefaultValue": 0
          }
        ]
      }
    },
    "Errores5xx": {
      "Type": "AWS::CloudWatch::Alarm",
      "Properties": {
        "Namespace": "EcoRAEE/API",
        "MetricName": "Errores5xx",
        "Statistic": "Sum",
        "Period": 300,
        "EvaluationPeriods": 1,
        "Threshold": 1,
        "ComparisonOperator": "GreaterThanOrEqualToThreshold",
        "TreatMissingData": "notBreaching",
        "AlarmActions": [
          {
            "Ref": "Topic"
          }
        ]
      }
    },
    "Panel": {
      "Type": "AWS::CloudWatch::Dashboard",
      "Properties": {
        "DashboardName": {
          "Fn::Sub": "${Prefijo}-operaciones"
        },
        "DashboardBody": {
          "Fn::Sub": [
            "{\"widgets\":[{\"type\":\"metric\",\"x\":0,\"y\":0,\"width\":12,\"height\":6,\"properties\":{\"title\":\"EC2 CPU y estado\",\"region\":\"${AWS::Region}\",\"period\":300,\"metrics\":[[\"AWS/EC2\",\"CPUUtilization\",\"InstanceId\",\"${Instancia}\"],[\".\",\"StatusCheckFailed\",\".\",\".\"]]}},{\"type\":\"metric\",\"x\":12,\"y\":0,\"width\":12,\"height\":6,\"properties\":{\"title\":\"RDS\",\"region\":\"${AWS::Region}\",\"period\":300,\"metrics\":[[\"AWS/RDS\",\"CPUUtilization\",\"DBInstanceIdentifier\",\"${Base}\"],[\".\",\"DatabaseConnections\",\".\",\".\"],[\".\",\"FreeStorageSpace\",\".\",\".\"]]}},{\"type\":\"metric\",\"x\":0,\"y\":6,\"width\":12,\"height\":6,\"properties\":{\"title\":\"Respuestas 5xx\",\"region\":\"${AWS::Region}\",\"stat\":\"Sum\",\"period\":300,\"metrics\":[[\"EcoRAEE/API\",\"Errores5xx\"]]}},{\"type\":\"log\",\"x\":12,\"y\":6,\"width\":12,\"height\":6,\"properties\":{\"title\":\"Latencia API (ms)\",\"region\":\"${AWS::Region}\",\"view\":\"timeSeries\",\"query\":\"SOURCE '${LogGroup}' | filter ispresent(ms) | stats avg(ms) as latencia_ms by bin(5m)\"}}]}",
            {
              "Instancia": {
                "Fn::ImportValue": {
                  "Fn::Sub": "${Prefijo}-InstanceId"
                }
              },
              "Base": {
                "Fn::ImportValue": {
                  "Fn::Sub": "${Prefijo}-DB"
                }
              },
              "LogGroup": {
                "Fn::ImportValue": {
                  "Fn::Sub": "${Prefijo}-GrupoLogs"
                }
              }
            }
          ]
        }
      }
    }
  },
  "Outputs": {
    "Topic": {
      "Value": {
        "Ref": "Topic"
      },
      "Export": {
        "Name": {
          "Fn::Sub": "${Prefijo}-Topic"
        }
      }
    }
  }
}
