{
  "AWSTemplateFormatVersion": "2010-09-09",
  "Description": "EcoRAEE - 07-observabilidad",
  "Parameters": {
    "Prefijo": {
      "Type": "String",
      "Default": "ecoraee-lab"
    },
    "Entorno": {
      "Type": "String",
      "Default": "lab"
    },
    "Responsable": {
      "Type": "String"
    },
    "BucketAuditoria": {
      "Type": "String"
    },
    "CorreoAlerta": {
      "Type": "String"
    },
    "PresupuestoUSD": {
      "Type": "Number",
      "Default": 100
    }
  },
  "Resources": {
    "Topic": {
      "Type": "AWS::SNS::Topic",
      "Properties": {
        "Tags": [
          {
            "Key": "Proyecto",
            "Value": "EcoRAEE"
          },
          {
            "Key": "Entorno",
            "Value": {
              "Ref": "Entorno"
            }
          },
          {
            "Key": "Responsable",
            "Value": {
              "Ref": "Responsable"
            }
          }
        ]
      }
    },
    "TrailBucket": {
      "Type": "AWS::S3::Bucket",
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain",
      "Properties": {
        "BucketName": {
          "Ref": "BucketAuditoria"
        },
        "PublicAccessBlockConfiguration": {
          "BlockPublicAcls": true,
          "BlockPublicPolicy": true,
          "IgnorePublicAcls": true,
          "RestrictPublicBuckets": true
        },
        "BucketEncryption": {
          "ServerSideEncryptionConfiguration": [
            {
              "ServerSideEncryptionByDefault": {
                "SSEAlgorithm": "AES256"
              }
            }
          ]
        },
        "VersioningConfiguration": {
          "Status": "Enabled"
        },
        "LifecycleConfiguration": {
          "Rules": [
            {
              "Id": "VersionesAntiguas",
              "Status": "Enabled",
              "NoncurrentVersionExpiration": {
                "NoncurrentDays": 90
              },
              "AbortIncompleteMultipartUpload": {
                "DaysAfterInitiation": 7
              }
            }
          ]
        },
        "Tags": [
          {
            "Key": "Proyecto",
            "Value": "EcoRAEE"
          },
          {
            "Key": "Entorno",
            "Value": {
              "Ref": "Entorno"
            }
          },
          {
            "Key": "Responsable",
            "Value": {
              "Ref": "Responsable"
            }
          }
        ]
      }
    },
    "TrailPolicy": {
      "Type": "AWS::S3::BucketPolicy",
      "Properties": {
        "Bucket": {
          "Ref": "TrailBucket"
        },
        "PolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "ACL",
              "Effect": "Allow",
              "Principal": {
                "Service": "cloudtrail.amazonaws.com"
              },
              "Action": "s3:GetBucketAcl",
              "Resource": {
                "Fn::GetAtt": [
                  "TrailBucket",
                  "Arn"
                ]
              }
            },
            {
              "Sid": "Write",
              "Effect": "Allow",
              "Principal": {
                "Service": "cloudtrail.amazonaws.com"
              },
              "Action": "s3:PutObject",
              "Resource": {
                "Fn::Sub": "arn:${AWS::Partition}:s3:::${BucketAuditoria}/AWSLogs/${AWS::AccountId}/*"
              },
              "Condition": {
                "StringEquals": {
                  "s3:x-amz-acl": "bucket-owner-full-control"
                }
              }
            }
          ]
        }
      }
    },
    "Trail": {
      "Type": "AWS::CloudTrail::Trail",
      "DependsOn": "TrailPolicy",
      "Properties": {
        "S3BucketName": {
          "Ref": "TrailBucket"
        },
        "IsLogging": true,
        "IsMultiRegionTrail": true,
        "EnableLogFileValidation": true,
        "IncludeGlobalServiceEvents": true,
        "Tags": [
          {
            "Key": "Proyecto",
            "Value": "EcoRAEE"
          },
          {
            "Key": "Entorno",
            "Value": {
              "Ref": "Entorno"
            }
          },
          {
            "Key": "Responsable",
            "Value": {
              "Ref": "Responsable"
            }
          }
        ]
      }
    },
    "Budget": {
      "Type": "AWS::Budgets::Budget",
      "Properties": {
        "Budget": {
          "BudgetName": {
            "Fn::Sub": "${Prefijo}-mensual"
          },
          "BudgetLimit": {
            "Amount": {
              "Ref": "PresupuestoUSD"
            },
            "Unit": "USD"
          },
          "TimeUnit": "MONTHLY",
          "BudgetType": "COST"
        },
        "NotificationsWithSubscribers": [
          {
            "Notification": {
              "NotificationType": "ACTUAL",
              "ComparisonOperator": "GREATER_THAN",
              "Threshold": 80,
              "ThresholdType": "PERCENTAGE"
            },
            "Subscribers": [
              {
                "SubscriptionType": "EMAIL",
                "Address": {
                  "Ref": "CorreoAlerta"
                }
              }
            ]
          }
        ]
      }
    },
    "ALB5xx": {
      "Type": "AWS::CloudWatch::Alarm",
      "Properties": {
        "Namespace": "AWS/ApplicationELB",
        "MetricName": "HTTPCode_ELB_5XX_Count",
        "Dimensions": [
          {
            "Name": "LoadBalancer",
            "Value": {
              "Fn::ImportValue": {
                "Fn::Sub": "${Prefijo}-ALBFullName"
              }
            }
          }
        ],
        "Statistic": "Sum",
        "Period": 300,
        "EvaluationPeriods": 1,
        "Threshold": 5,
        "ComparisonOperator": "GreaterThanThreshold",
        "TreatMissingData": "notBreaching",
        "AlarmActions": [
          {
            "Ref": "Topic"
          }
        ]
      }
    },
    "Hosts": {
      "Type": "AWS::CloudWatch::Alarm",
      "Properties": {
        "Namespace": "AWS/ApplicationELB",
        "MetricName": "UnHealthyHostCount",
        "Dimensions": [
          {
            "Name": "LoadBalancer",
            "Value": {
              "Fn::ImportValue": {
                "Fn::Sub": "${Prefijo}-ALBFullName"
              }
            }
          },
          {
            "Name": "TargetGroup",
            "Value": {
              "Fn::ImportValue": {
                "Fn::Sub": "${Prefijo}-TargetFullName"
              }
            }
          }
        ],
        "Statistic": "Maximum",
        "Period": 300,
        "EvaluationPeriods": 1,
        "Threshold": 0,
        "ComparisonOperator": "GreaterThanThreshold",
        "TreatMissingData": "notBreaching",
        "AlarmActions": [
          {
            "Ref": "Topic"
          }
        ]
      }
    },
    "CPU": {
      "Type": "AWS::CloudWatch::Alarm",
      "Properties": {
        "Namespace": "AWS/EC2",
        "MetricName": "CPUUtilization",
        "Dimensions": [
          {
            "Name": "AutoScalingGroupName",
            "Value": {
              "Fn::ImportValue": {
                "Fn::Sub": "${Prefijo}-ASG"
              }
            }
          }
        ],
        "Statistic": "Average",
        "Period": 300,
        "EvaluationPeriods": 1,
        "Threshold": 80,
        "ComparisonOperator": "GreaterThanThreshold",
        "TreatMissingData": "notBreaching",
        "AlarmActions": [
          {
            "Ref": "Topic"
          }
        ]
      }
    },
    "DBCPU": {
      "Type": "AWS::CloudWatch::Alarm",
      "Properties": {
        "Namespace": "AWS/RDS",
        "MetricName": "CPUUtilization",
        "Dimensions": [
          {
            "Name": "DBInstanceIdentifier",
            "Value": {
              "Fn::ImportValue": {
                "Fn::Sub": "${Prefijo}-DB"
              }
            }
          }
        ],
        "Statistic": "Average",
        "Period": 300,
        "EvaluationPeriods": 1,
        "Threshold": 80,
        "ComparisonOperator": "GreaterThanThreshold",
        "TreatMissingData": "notBreaching",
        "AlarmActions": [
          {
            "Ref": "Topic"
          }
        ]
      }
    },
    "DBSpace": {
      "Type": "AWS::CloudWatch::Alarm",
      "Properties": {
        "Namespace": "AWS/RDS",
        "MetricName": "FreeStorageSpace",
        "Dimensions": [
          {
            "Name": "DBInstanceIdentifier",
            "Value": {
              "Fn::ImportValue": {
                "Fn::Sub": "${Prefijo}-DB"
              }
            }
          }
        ],
        "Statistic": "Average",
        "Period": 300,
        "EvaluationPeriods": 1,
        "Threshold": 2147483648,
        "ComparisonOperator": "LessThanThreshold",
        "TreatMissingData": "notBreaching",
        "AlarmActions": [
          {
            "Ref": "Topic"
          }
        ]
      }
    },
    "DBConnections": {
      "Type": "AWS::CloudWatch::Alarm",
      "Properties": {
        "Namespace": "AWS/RDS",
        "MetricName": "DatabaseConnections",
        "Dimensions": [
          {
            "Name": "DBInstanceIdentifier",
            "Value": {
              "Fn::ImportValue": {
                "Fn::Sub": "${Prefijo}-DB"
              }
            }
          }
        ],
        "Statistic": "Average",
        "Period": 300,
        "EvaluationPeriods": 1,
        "Threshold": 70,
        "ComparisonOperator": "GreaterThanThreshold",
        "TreatMissingData": "notBreaching",
        "AlarmActions": [
          {
            "Ref": "Topic"
          }
        ]
      }
    }
  },
  "Outputs": {
    "Topic": {
      "Value": {
        "Ref": "Topic"
      },
      "Export": {
        "Name": {
          "Fn::Sub": "${Prefijo}-Topic"
        }
      }
    }
  }
}
