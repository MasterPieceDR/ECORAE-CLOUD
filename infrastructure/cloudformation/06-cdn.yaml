{
  "AWSTemplateFormatVersion": "2010-09-09",
  "Description": "EcoRAEE - 06-cdn",
  "Parameters": {
    "Prefijo": {
      "Type": "String",
      "Default": "ecoraee-lab"
    },
    "Entorno": {
      "Type": "String",
      "Default": "lab"
    },
    "Responsable": {
      "Type": "String"
    },
    "BucketFrontend": {
      "Type": "String"
    }
  },
  "Resources": {
    "OAC": {
      "Type": "AWS::CloudFront::OriginAccessControl",
      "Properties": {
        "OriginAccessControlConfig": {
          "Name": {
            "Fn::Sub": "${Prefijo}-oac"
          },
          "OriginAccessControlOriginType": "s3",
          "SigningBehavior": "always",
          "SigningProtocol": "sigv4"
        }
      }
    },
    "SpaFunction": {
      "Type": "AWS::CloudFront::Function",
      "Properties": {
        "Name": {
          "Fn::Sub": "${Prefijo}-spa"
        },
        "AutoPublish": true,
        "FunctionConfig": {
          "Comment": "Rutas de SPA",
          "Runtime": "cloudfront-js-1.0"
        },
        "FunctionCode": "function handler(event) { var r=event.request; if (!r.uri.split('/').pop().includes('.')) r.uri='/index.html'; return r; }"
      }
    },
    "Distribution": {
      "Type": "AWS::CloudFront::Distribution",
      "Properties": {
        "DistributionConfig": {
          "Enabled": true,
          "DefaultRootObject": "index.html",
          "HttpVersion": "http2and3",
          "Origins": [
            {
              "Id": "web",
              "DomainName": {
                "Fn::Sub": "${BucketFrontend}.s3.${AWS::Region}.${AWS::URLSuffix}"
              },
              "OriginAccessControlId": {
                "Fn::GetAtt": [
                  "OAC",
                  "Id"
                ]
              },
              "S3OriginConfig": {
                "OriginAccessIdentity": ""
              }
            },
            {
              "Id": "api",
              "DomainName": {
                "Fn::ImportValue": {
                  "Fn::Sub": "${Prefijo}-ALBDNS"
                }
              },
              "CustomOriginConfig": {
                "OriginProtocolPolicy": "http-only",
                "HTTPPort": 80
              }
            }
          ],
          "DefaultCacheBehavior": {
            "TargetOriginId": "web",
            "ViewerProtocolPolicy": "redirect-to-https",
            "AllowedMethods": [
              "GET",
              "HEAD",
              "OPTIONS"
            ],
            "CachePolicyId": "658327ea-f89d-4fab-a63d-7e88639e58f6",
            "FunctionAssociations": [
              {
                "EventType": "viewer-request",
                "FunctionARN": {
                  "Fn::GetAtt": [
                    "SpaFunction",
                    "FunctionARN"
                  ]
                }
              }
            ]
          },
          "CacheBehaviors": [
            {
              "PathPattern": "/api/*",
              "TargetOriginId": "api",
              "ViewerProtocolPolicy": "redirect-to-https",
              "AllowedMethods": [
                "GET",
                "HEAD",
                "OPTIONS",
                "PUT",
                "POST",
                "PATCH",
                "DELETE"
              ],
              "CachePolicyId": "4135ea2d-6df8-44a3-9df3-4b5a84be39ad",
              "OriginRequestPolicyId": "b689b0a8-53d0-40ab-baf2-68738e2966ac"
            }
          ],
          "ViewerCertificate": {
            "CloudFrontDefaultCertificate": true
          }
        },
        "Tags": [
          {
            "Key": "Proyecto",
            "Value": "EcoRAEE"
          },
          {
            "Key": "Entorno",
            "Value": {
              "Ref": "Entorno"
            }
          },
          {
            "Key": "Responsable",
            "Value": {
              "Ref": "Responsable"
            }
          }
        ]
      }
    },
    "WebPolicy": {
      "Type": "AWS::S3::BucketPolicy",
      "Properties": {
        "Bucket": {
          "Ref": "BucketFrontend"
        },
        "PolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "Service": "cloudfront.amazonaws.com"
              },
              "Action": "s3:GetObject",
              "Resource": {
                "Fn::Sub": "arn:${AWS::Partition}:s3:::${BucketFrontend}/*"
              },
              "Condition": {
                "StringEquals": {
                  "AWS:SourceArn": {
                    "Fn::Sub": "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"
                  }
                }
              }
            }
          ]
        }
      }
    }
  },
  "Outputs": {
    "DistributionId": {
      "Value": {
        "Ref": "Distribution"
      },
      "Export": {
        "Name": {
          "Fn::Sub": "${Prefijo}-DistributionId"
        }
      }
    },
    "Domain": {
      "Value": {
        "Fn::GetAtt": [
          "Distribution",
          "DomainName"
        ]
      },
      "Export": {
        "Name": {
          "Fn::Sub": "${Prefijo}-Domain"
        }
      }
    }
  }
}
