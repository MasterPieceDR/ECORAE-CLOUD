services:
  api:
    image: ${IMAGEN_API:?Indique IMAGEN_API}
    restart: unless-stopped
    ports: ["8000:8000"]
    env_file: .env.aws # Incluye SNS_TOPIC_ARN opcional.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=* --no-access-log
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:?Indique AWS_REGION}
        awslogs-group: ${GRUPO_LOGS:?Indique GRUPO_LOGS}
        awslogs-stream: api
  mcp:
    profiles: [mcp]
    image: ${IMAGEN_API:?Indique IMAGEN_API}
    restart: unless-stopped
    env_file: .env.aws
    command: uvicorn mcp_server.server:app --host 0.0.0.0 --port 8001 --no-access-log
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:?Indique AWS_REGION}
        awslogs-group: ${GRUPO_LOGS:?Indique GRUPO_LOGS}
        awslogs-stream: mcp
