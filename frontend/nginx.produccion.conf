server {
  listen 80;
  server_tokens off;
  root /usr/share/nginx/html;
  client_max_body_size 25m;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http://localhost:4566; connect-src 'self' http://localhost:4566; media-src 'self' blob: http://localhost:4566; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always; # solo HTTPS
  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }
  location / { try_files $uri /index.html; }
}
