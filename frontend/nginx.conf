# Emula la distribución de CloudFront: / desde el "bucket" y /api/* hacia el balanceador (aquí, el contenedor api)
server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 600m;               # videos de capacitación (máx. 500 MB) en modo almacén local
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
    proxy_read_timeout 120s;
  }
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }
}
