name: ecoraee-prod
services:
  db:
    image: postgres:16-alpine
    env_file: .env.produccion.db
    environment:
      POSTGRES_DB: ecoraee
      POSTGRES_USER: ecoraee_admin
      DEMO: "false"
    volumes:
      - ./database:/database:ro
      - ./database/docker-init.sh:/docker-entrypoint-initdb.d/00_ecoraee.sh:ro
      - datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecoraee_admin -d ecoraee && psql -U ecoraee_admin -d ecoraee -tAc \"select 1 from aud.evento_seguridad where detalle->>'accion'='BLOQUEO_CUENTAS_SINTETICAS' and exists (select 1 from pg_roles where rolname='ecoraee_api_svc') limit 1\" | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 40
  localstack:
    build:
      context: .
      dockerfile: scripts/localstack/Dockerfile
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: us-east-1
    ports: ["127.0.0.1:4566:4566"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import json,urllib.request; d=json.load(urllib.request.urlopen('http://localhost:4566/_localstack/init/ready')); assert d['completed'] and d['scripts'] and all(s['state']=='SUCCESSFUL' for s in d['scripts'])\""]
      interval: 5s
      timeout: 5s
      retries: 40
  api:
    build: {context: ., dockerfile: backend/Dockerfile}
    env_file: .env.produccion.api
    environment:
      ENTORNO: produccion
      DEMO: "false"
      AUTH_MODO: local
      DB_HOST: db
      DB_NOMBRE: ecoraee
      ALMACEN_MODO: s3
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ENDPOINT_URL_PUBLICA: http://localhost:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      BUCKET_EVIDENCIAS: ecoraee-evidencias
      BUCKET_CONTENIDOS: ecoraee-contenidos
      CORS_ORIGENES: http://localhost:8090
    depends_on:
      db: {condition: service_healthy}
      localstack: {condition: service_healthy}
  web:
    build: ./frontend
    volumes: ["./frontend/nginx.produccion.conf:/etc/nginx/conf.d/default.conf:ro"]
    ports: ["8090:80"]
    depends_on: {api: {condition: service_healthy}}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  datos:
